{% extends "base.html" %}
{% block title %}新增藏品 — 藏阁{% endblock %}
{% block content %}
<section class="form-page">
  <div class="form-intro"><p class="eyebrow">新藏入阁</p><h1>录下一件物，<br><em>留住一刻。</em></h1><p>先写下今天知道的就好。不确定和猜测也可以被记录——资料会和藏品一起慢慢生长。</p></div>
  <form class="object-form" method="post">
    {% with messages = get_flashed_messages() %}{% if messages %}<div class="form-error">{{ messages[0] }}</div>{% endif %}{% endwith %}
    <fieldset><legend>01 · 藏品本身</legend>
      <label class="wide">名称 <input name="name" value="{{ form.get('name','') }}" placeholder="蓝绿色变色织物" required></label>
      <label>类别 <input name="category" value="{{ form.get('category','') }}" placeholder="织物" required></label>
      <label>图片网址 <input name="image_url" value="{{ form.get('image_url','') }}" placeholder="https://…"></label>
      <label>材料 <input name="material" value="{{ form.get('material','') }}" placeholder="丝"></label>
      <label>工艺 <input name="technique" value="{{ form.get('technique','') }}" placeholder="手工织造"></label>
      <label>制作者 <input name="maker" value="{{ form.get('maker','') }}" placeholder="姓名或佚名"></label>
      <label>文化 / 地区 <input name="culture_region" value="{{ form.get('culture_region','') }}" placeholder="泰国北部"></label>
    </fieldset>
    <fieldset><legend>02 · 如何得到</legend>
      <label>日期 <input name="acquired_date" value="{{ form.get('acquired_date','') }}" placeholder="2026-08-27 或 2018"></label>
      <label>日期精度
        <select name="date_precision"><option value="exact">准确日期</option><option value="month">大约月份</option><option value="year">大约年份</option><option value="unknown">不清楚</option></select>
      </label>
      <label>城市 / 地点 <input name="place" value="{{ form.get('place','') }}" placeholder="曼谷"></label>
      <label>国家 <input name="country" value="{{ form.get('country','') }}" placeholder="泰国"></label>
      <label>店铺 / 来源 <input name="source" value="{{ form.get('source','') }}" placeholder="市集、店铺、人物……"></label>
      <label>价格 <input name="price" value="{{ form.get('price','') }}" placeholder="฿2,400"></label>
    </fieldset>
    <fieldset><legend>03 · 记忆与知识</legend>
      <label class="wide">它的故事 <textarea name="story" rows="6" placeholder="是什么让你停下来？店主说了什么？你当时还在另一件东西之间犹豫吗？">{{ form.get('story','') }}</textarea></label>
      <label>知识状态
        <select name="knowledge_status"><option value="confirmed">✓ 已经确认</option><option value="seller">≈ 店主口述</option><option value="guess">? 我的推测</option><option value="unknown" selected>? 有待考证</option></select>
      </label>
      <label>证据 <input name="evidence" value="{{ form.get('evidence','') }}" placeholder="收据 · 旧照片 · 个人记忆"></label>
      <label>保存状况 <input name="condition" value="{{ form.get('condition','') }}" placeholder="良好"></label>
    </fieldset>
    <button class="save-button" type="submit">收入藏阁 <span>→</span></button>
  </form>
</section>
{% endblock %}
